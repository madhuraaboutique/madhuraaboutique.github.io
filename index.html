<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="Browse Mg Madhuraa Boutique's premium product catalog — search, filter, and inquire via WhatsApp.">
<title>Mg Madhuraa Boutique | Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   ✨ ENCHANTED BOUTIQUE DESIGN SYSTEM ✨
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:#09090b;color:#f8fafc;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{--bg:#09090b;--bg2:#18181b;--card:#27272a;--acc:#6366f1;--acc2:#ec4899;--glow:rgba(99,102,241,0.25);--txt:#f8fafc;--txt2:#94a3b8;--muted:#475569;--err:#f43f5e;--ok:#10b981;--bdr:rgba(255,255,255,0.08);--bdr2:rgba(99,102,241,0.3);--r:12px;--r2:18px;--rf:9999px;--sh:0 10px 30px rgba(0,0,0,0.5);--tr:all 0.3s cubic-bezier(0.4,0,0.2,1)}

/* ✦ CUSTOM CURSOR TRAIL ✦ */
.cursor-trail {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(236,72,153,0.6), transparent);
  animation: cursorPulse 1s ease-out forwards;
  mix-blend-mode: screen;
}

@keyframes cursorPulse {
  0% { transform: scale(0.5); opacity: 1; }
  100% { transform: scale(2); opacity: 0; }
}

/* ✦ MAGICAL BACKGROUND PARTICLES ✦ */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 20% 50%, rgba(236,72,153,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(99,102,241,0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(168,85,247,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
  animation: magicalBg 20s ease-in-out infinite;
}

@keyframes magicalBg {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  25% { transform: translate(40px, -30px) rotate(2deg) scale(1.1); }
  50% { transform: translate(-20px, 40px) rotate(-1deg) scale(0.9); }
  75% { transform: translate(-30px, -20px) rotate(1deg) scale(1.05); }
}

/* ✦ SPARKLE CONTAINER ✦ */
.sparkle-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* ✦ FLOATING SPARKLES ✦ */
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  animation: sparkleFloat 4s ease-in-out infinite;
  box-shadow: 0 0 10px #fff, 0 0 20px #ec4899, 0 0 30px #a855f7;
}

.sparkle.pink {
  background: #ec4899;
  box-shadow: 0 0 15px #ec4899, 0 0 30px #f472b6;
}

.sparkle.purple {
  background: #a855f7;
  box-shadow: 0 0 15px #a855f7, 0 0 30px #c084fc;
}

.sparkle.gold {
  background: #fbbf24;
  box-shadow: 0 0 15px #fbbf24, 0 0 30px #fcd34d;
}

@keyframes sparkleFloat {
  0% { opacity: 0; transform: translateY(0) scale(0) rotate(0deg); }
  30% { opacity: 1; }
  70% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(-100vh) scale(1.5) rotate(360deg); }
}

/* ✦ BUTTERFLY ANIMATION ✦ */
.butterfly {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  font-size: 24px;
  animation: butterflyFly 6s ease-in-out forwards;
  filter: drop-shadow(0 0 15px rgba(236,72,153,0.8));
}

.butterfly.neon {
  text-shadow: 0 0 20px #ec4899, 0 0 40px #a855f7, 0 0 60px #ec4899;
}

@keyframes butterflyFly {
  0% { 
    opacity: 0; 
    transform: translate(0, 0) scale(0) rotate(0deg); 
  }
  10% { 
    opacity: 1; 
    transform: translate(20px, -30px) scale(1) rotate(15deg); 
  }
  30% { 
    transform: translate(50px, -80px) scale(1.2) rotate(-10deg); 
  }
  50% { 
    transform: translate(100px, -60px) scale(1.1) rotate(5deg); 
  }
  70% { 
    transform: translate(150px, -120px) scale(1.3) rotate(-5deg); 
  }
  90% { 
    opacity: 0.8; 
    transform: translate(200px, -150px) scale(1) rotate(10deg); 
  }
  100% { 
    opacity: 0; 
    transform: translate(250px, -200px) scale(0.5) rotate(0deg); 
  }
}

/* ✦ BUTTERFLY WING FLAP ✦ */
.butterfly::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 40px;
  height: 40px;
  background: radial-gradient(circle, rgba(236,72,153,0.3), transparent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: wingGlow 0.5s ease-in-out infinite alternate;
}

@keyframes wingGlow {
  from { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
  to { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
}

/* ✦ HEART BURST ✦ */
.heart-burst {
  position: fixed;
  pointer-events: none;
  z-index: 9997;
  animation: heartExplode 2s ease-out forwards;
}

.heart-particle {
  position: absolute;
  font-size: 16px;
  animation: heartParticle 2s ease-out forwards;
  filter: drop-shadow(0 0 10px rgba(236,72,153,0.8));
}

@keyframes heartExplode {
  0% { opacity: 1; transform: scale(0.5); }
  100% { opacity: 0; transform: scale(1.5); }
}

@keyframes heartParticle {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
}

/* ✦ CLICK SPARKLE BURST ✦ */
.click-sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  animation: sparkleBurst 1.5s ease-out forwards;
  box-shadow: 0 0 15px #ec4899, 0 0 30px #a855f7, 0 0 45px #fbbf24;
}

@keyframes sparkleBurst {
  0% { 
    opacity: 1; 
    transform: translate(0, 0) scale(1); 
  }
  100% { 
    opacity: 0; 
    transform: translate(var(--sx), var(--sy)) scale(0); 
  }
}

/* ✦ MAGIC DUST TRAIL ✦ */
.magic-dust {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  font-size: 12px;
  animation: dustFall 2s ease-out forwards;
  filter: drop-shadow(0 0 8px rgba(168,85,247,0.6));
}

@keyframes dustFall {
  0% { opacity: 0; transform: translate(0, 0) scale(0); }
  20% { opacity: 1; transform: translate(10px, -10px) scale(1); }
  100% { opacity: 0; transform: translate(30px, 100px) scale(0.2); }
}

/* ✦ NEON RING PULSE ON CLICK ✦ */
.neon-ring {
  position: fixed;
  pointer-events: none;
  z-index: 9997;
  width: 50px;
  height: 50px;
  border: 2px solid rgba(236,72,153,0.8);
  border-radius: 50%;
  animation: ringExpand 1s ease-out forwards;
  box-shadow: 0 0 20px #ec4899, 0 0 40px #a855f7, inset 0 0 20px rgba(236,72,153,0.3);
}

@keyframes ringExpand {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
}

/* ✦ STAR TWINKLE ✦ */
.star {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  animation: starTwinkle 1.5s ease-out forwards;
}

.star::before,
.star::after {
  content: '✦';
  position: absolute;
  font-size: 20px;
  animation: starGlow 0.5s ease-in-out infinite alternate;
}

.star::after {
  animation-delay: 0.25s;
  font-size: 14px;
}

@keyframes starTwinkle {
  0% { transform: scale(0) rotate(0deg); opacity: 0; }
  50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
  100% { transform: scale(0) rotate(360deg); opacity: 0; }
}

@keyframes starGlow {
  from { text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24; }
  to { text-shadow: 0 0 20px #fcd34d, 0 0 40px #fde68a; }
}

/* ✦ RAINBOW TRAIL ✦ */
.rainbow-dot {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: rainbowFloat 2s ease-out forwards;
}

@keyframes rainbowFloat {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  50% { opacity: 0.8; transform: translate(var(--rx), -50px) scale(1.5); }
  100% { opacity: 0; transform: translate(var(--rx), -150px) scale(0); }
}

/* ✦ FLOATING PETALS ✦ */
.petal {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  font-size: 18px;
  animation: petalFall 5s linear forwards;
  filter: drop-shadow(0 0 5px rgba(236,72,153,0.5));
}

@keyframes petalFall {
  0% { opacity: 0; transform: translate(0, -20px) rotate(0deg) scale(0.5); }
  10% { opacity: 1; }
  90% { opacity: 0.8; }
  100% { opacity: 0; transform: translate(var(--px), 100vh) rotate(var(--pr)) scale(1); }
}

/* ✦ GLOW AURA ON HOVER ✦ */
.glow-aura {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: radial-gradient(circle, rgba(236,72,153,0.2), transparent 70%);
  opacity: 0;
  transition: opacity 0.5s;
}

/* Rest of existing styles remain the same... */
/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #ec4899, #a855f7); border-radius: var(--rf); }
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #f472b6, #c084fc); }

/* ═══ NAVBAR (Premium Glassmorphism) ═══ */
.topnav{
  position:sticky;top:0;z-index:200;height:70px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;gap:15px;
  background:rgba(9,9,11,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--bdr);animation: slideDown 0.8s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 5px 30px rgba(236,72,153,0.1);
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.brand{
  font-size:1.4rem;font-weight:800;
  background:linear-gradient(to right,#fff 0%, #ec4899 50%, #a855f7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;flex-shrink:0;line-height:1.1;letter-spacing:-0.5px;
  animation: brandShine 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(236,72,153,0.5));
}

@keyframes brandShine {
  0%, 100% { filter: drop-shadow(0 0 20px rgba(236,72,153,0.5)); }
  50% { filter: drop-shadow(0 0 40px rgba(168,85,247,0.8)); }
}

.brand small{
  display:block;font-size:0.65rem;-webkit-text-fill-color:var(--txt2);
  font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-top:2px;
  animation: tagSlide 0.6s ease-out 0.3s both;
}

@keyframes tagSlide {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.srchwrap{
  flex:1;position:relative;max-width:400px;margin:0;padding:1.5px;border-radius:var(--rf);
  background:linear-gradient(90deg, #ec4899, #a855f7, #6366f1, #ec4899, #fbbf24, #ec4899);
  background-size:300% 100%;animation: google-flow 8s linear infinite, searchAppear 0.6s ease-out 0.2s both;
  z-index:1;box-shadow: 0 0 30px rgba(236,72,153,0.3);
}

@keyframes searchAppear {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.srchwrap::after{
  content:'';position:absolute;inset:0;border-radius:var(--rf);
  box-shadow:0 0 20px rgba(236,72,153,0.2);pointer-events:none;
}

@keyframes google-flow{
  0%{background-position:0% 0%}
  100%{background-position:300% 0%}
}

.srchwrap input{
  width:100%;height:40px;padding:0 16px 0 46px;background:#09090b;
  border:none;border-radius:var(--rf);color:var(--txt);font-family:inherit;
  font-size:0.92rem;transition:var(--tr);display:block;
}

.srchwrap input:focus{
  outline:none;background:#111;box-shadow: 0 0 30px rgba(236,72,153,0.3);
}

.srchwrap:focus-within{
  animation-duration:3s;box-shadow:0 0 40px rgba(236,72,153,0.5);
  transform: scale(1.03);
}

.srchwrap input::placeholder{color:var(--txt2); transition: 0.3s;}
.srchwrap:focus-within input::placeholder{opacity: 0.5;}

.srchwrap .si{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  color:var(--txt2);font-size:1.2rem;pointer-events:none;z-index:2;
  transition:var(--tr);animation: searchIconPulse 2s ease-in-out infinite;
}

@keyframes searchIconPulse {
  0%, 100% { transform: translateY(-50%) scale(1); }
  50% { transform: translateY(-50%) scale(1.2); color: #ec4899; }
}

.srchwrap:focus-within .si{
  color:#ec4899;transform:translateY(-50%) scale(1.4) rotate(15deg);
  animation: none;
}

/* Keep all remaining existing styles from previous version... */
/* [Previous styles continue here - I'll add the key new animations above the existing codebase] */

/* ⭐ NEW: Interactive Card Glow */
.pcard {
  position: relative;
  overflow: visible;
}

.pcard::after {
  content: '';
  position: absolute;
  inset: -2px;
  background: linear-gradient(135deg, #ec4899, #a855f7, #6366f1);
  border-radius: 20px;
  z-index: -1;
  opacity: 0;
  transition: opacity 0.3s;
  filter: blur(15px);
}

.pcard:hover::after {
  opacity: 0.6;
  animation: borderGlow 1.5s ease-in-out infinite alternate;
}

@keyframes borderGlow {
  from { filter: blur(15px); opacity: 0.4; }
  to { filter: blur(25px); opacity: 0.8; }
}

/* ⭐ Click Me Badge Animation */
.click-me {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(236,72,153,0.9);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 800;
  z-index: 3;
  animation: clickMePulse 2s ease-in-out infinite;
  pointer-events: none;
}

@keyframes clickMePulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 20px rgba(236,72,153,0.5); }
  50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 40px rgba(236,72,153,0.8); }
}

/* Include all existing styles from previous version here... */
/* For brevity, I'm showing only the new additions. The complete file would merge both. */

</style>
</head>

<script>
(function () {
  'use strict';
  let D = window.__D__ || null;
  let AP = [];
  let _settings = {};

  // ═══════════════════════════════════════════
  // ✨ ENCHANTED ANIMATION SYSTEM ✨
  // ═══════════════════════════════════════════

  // 🦋 Create Neon Butterfly
  function createButterfly(x, y) {
    const butterflies = ['🦋', '🧚', '✨', '💫', '🌟'];
    const butterfly = document.createElement('div');
    butterfly.className = 'butterfly neon';
    butterfly.textContent = butterflies[Math.floor(Math.random() * butterflies.length)];
    butterfly.style.left = x + 'px';
    butterfly.style.top = y + 'px';
    butterfly.style.fontSize = (Math.random() * 30 + 20) + 'px';
    
    document.body.appendChild(butterfly);
    
    setTimeout(() => {
      if (butterfly.parentNode) butterfly.parentNode.removeChild(butterfly);
    }, 6000);
  }

  // 💖 Heart Burst Effect
  function createHeartBurst(x, y) {
    const hearts = ['💖', '💕', '💗', '💝', '💘', '❤️', '🩷', '💜', '🦋', '🌸'];
    const burst = document.createElement('div');
    burst.className = 'heart-burst';
    burst.style.left = x + 'px';
    burst.style.top = y + 'px';
    
    for (let i = 0; i < 12; i++) {
      const particle = document.createElement('span');
      particle.className = 'heart-particle';
      particle.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      const angle = (i / 12) * Math.PI * 2;
      const distance = Math.random() * 80 + 40;
      particle.style.setProperty('--x', Math.cos(angle) * distance + 'px');
      particle.style.setProperty('--y', Math.sin(angle) * distance + 'px');
      particle.style.animationDelay = Math.random() * 0.3 + 's';
      burst.appendChild(particle);
    }
    
    document.body.appendChild(burst);
    
    setTimeout(() => {
      if (burst.parentNode) burst.parentNode.removeChild(burst);
    }, 2000);
  }

  // ✨ Click Sparkle Burst
  function createClickSparkles(x, y) {
    const colors = ['#ec4899', '#a855f7', '#6366f1', '#fbbf24', '#f472b6', '#c084fc', '#fde68a', '#fff'];
    
    for (let i = 0; i < 20; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'click-sparkle';
      sparkle.style.left = x + 'px';
      sparkle.style.top = y + 'px';
      
      const angle = (Math.random() * Math.PI * 2);
      const distance = Math.random() * 100 + 50;
      sparkle.style.setProperty('--sx', Math.cos(angle) * distance + 'px');
      sparkle.style.setProperty('--sy', Math.sin(angle) * distance + 'px');
      sparkle.style.animationDelay = Math.random() * 0.2 + 's';
      sparkle.style.width = (Math.random() * 6 + 2) + 'px';
      sparkle.style.height = sparkle.style.width;
      sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
      sparkle.style.boxShadow = `0 0 15px ${colors[Math.floor(Math.random() * colors.length)]}`;
      
      document.body.appendChild(sparkle);
      
      setTimeout(() => {
        if (sparkle.parentNode) sparkle.parentNode.removeChild(sparkle);
      }, 1500);
    }
  }

  // 💫 Neon Ring
  function createNeonRing(x, y) {
    const ring = document.createElement('div');

  // 🌈 Rainbow Trail
  function createRainbowTrail(x, y) {
    const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];

      dot.style.top = y + 'px';

        if (dot.parentNode) dot.parentNode.removeChild(dot);

    const dusts = ['✦', '✧', '⋆', '✶', '✵', '💫', '✨', '⭐'];

  // ═══════════════════════════════════════════
  // ORIGINAL FUNCTIONALITY (Enhanced)
  // ═══════════════════════════════════════════

  function e(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function pad(n) { return String(n||'').padStart(3, '0'); }
  
  function code(p) { return p.productNumber ? '#' + pad(p.productNumber) : 'ID: ' + p.id.substring(0, 6).toUpperCase(); }
  function getRawIdForWA(p) { return p.productNumber ? '#' + pad(p.productNumber) : p.id.substring(0,6).toUpperCase(); }

  function minP(p) {
    if (!p.variants||!p.variants.length) return 0;
    let m = Infinity;
    p.variants.forEach(v=>(v.sizes||[]).forEach(s=>{if(+s.sellPrice<m)m=+s.sellPrice;}));
    return m===Infinity?0:m;
  }
  function totS(p) { let t=0; (p.variants||[]).forEach(v=>(v.sizes||[]).forEach(s=>{t+=parseFloat(s.stock)||0;})); return t; }
  function clr(n) {
    const m = {red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#eab308',pink:'#ec4899',purple:'#a855f7',orange:'#f97316',white:'#f1f5f9',black:'#111',grey:'#9ca3af',maroon:'#881337',navy:'#1e3a5f'};
    for (const [k, v] of Object.entries(m)) if((n||'').toLowerCase().includes(k)) return v;
    return n||'#ec4899';
  }
  function toast(msg) {
    const tc = document.getElementById('tc'); if(!tc)return;
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    tc.appendChild(t); setTimeout(()=>t.remove(), 3500);
  }

  const C = {
    cat: 'all', q: '', iq: [], _t: null,
    filters: { sizes:[], colors:[], minPrice:'', maxPrice:'', avail:'all' },
    sort: '',
    _fopen: false,

    async init() {
      initEnchantedEffects();
      
      document.getElementById('fyr').textContent = new Date().getFullYear();
      if (D) { this.setup(D); return; }

      let lsMeta = null;
      try {
        const ls = localStorage.getItem('bq_shop_preview');
        if (ls) {
          const lsData = JSON.parse(ls);
          if (lsData && lsData.previewMode) {
             lsMeta = lsData;
          } else if (lsData && lsData.products && lsData.products.length > 0) {
             this.setup(lsData); return;
          }
        }
      } catch(e) { }

      const safetyTimer = setTimeout(() => {
        const g = document.getElementById('pgrid');
        if (g && g.querySelector('.spinner')) {
          g.innerHTML = this._noDataMsg();
        }
      }, 5000);

      try {
        try {
          const idbData = await this._loadFromIDB();
          if (idbData && idbData.products && idbData.products.length > 0) {
            clearTimeout(safetyTimer);
            if (lsMeta) {
              idbData.shopName = lsMeta.shopName || idbData.shopName;
              idbData.tagline = lsMeta.tagline || idbData.tagline;
              if (lsMeta.settings) Object.assign(idbData.settings, lsMeta.settings);
              if (lsMeta.categories && lsMeta.categories.length) idbData.categories = lsMeta.categories;
            }
            this.setup(idbData); return;
          }
        } catch(e) { }

        try {
          const r = await fetch('data/products.json?v='+Date.now());
          if (r.ok) {
            const json = await r.json();
            if (json && json.products && json.products.length > 0) {
              clearTimeout(safetyTimer);
              this.setup(json); return;
            }
          }
        } catch(e) { }

        clearTimeout(safetyTimer);
        document.getElementById('pgrid').innerHTML = this._noDataMsg();
      } catch(err) {
        clearTimeout(safetyTimer);
        document.getElementById('pgrid').innerHTML = this._noDataMsg();
      }
    },

    _noDataMsg() {
      const isGitHub = location.hostname.includes('github.io') || location.hostname.includes('github.com');
      if (isGitHub) {
        return `<div class="state">
          <h3>✨ Products Coming Soon!</h3>
          <p style="color: #ec4899;">Our enchanted collection is being prepared...</p>
        </div>`;
      }
      return `<div class="state"><h3>✨ Shop Not Published Yet</h3><p>Open the <b>Admin Panel</b> to preview.</p></div>`;
    },

    _loadFromIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('BoutiqueManagerV2');
        req.onerror = () => reject(new Error('IDB unavailable'));
        req.onsuccess = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains('products')) {
            db.close(); return reject(new Error('No products store'));
          }
          const storeNames = ['products','categories','settings'].filter(s => db.objectStoreNames.contains(s));
          const tx = db.transaction(storeNames, 'readonly');
          let products = [], categories = [];
          let sVals = {}, sExpected = 0, sDone = 0;
          const sKeys = ['shopName','shopInitials','tagline','phone','whatsappNumber','instagramHandle'];

          const pReq = tx.objectStore('products').getAll();
          const cReq = storeNames.includes('categories') ? tx.objectStore('categories').getAll() : null;

          if (storeNames.includes('settings')) {
            sExpected = sKeys.length;
            sKeys.forEach(k => {
              const gr = tx.objectStore('settings').get(k);
              gr.onsuccess = () => {
                sVals[k] = gr.result ? gr.result.value : '';
                sDone++;
                tryFinish();
              };
            });
          }

          tx.onerror = () => reject(new Error('IDB tx error'));

          let pOk=false, cOk=!cReq;
          pReq.onsuccess = () => { products = pReq.result||[]; pOk=true; tryFinish(); };
          if (cReq) cReq.onsuccess = () => { categories = cReq.result||[]; cOk=true; tryFinish(); };
          else tryFinish();

          function tryFinish() {
            if (!pOk || !cOk || sDone < sExpected) return;
            db.close();
            resolve({
              shopName: sVals.shopName || 'Boutique',
              tagline: sVals.tagline || '',
              settings: {
                shopInitials: sVals.shopInitials||'RB',
                phone: sVals.phone||'',
                whatsappNumber: sVals.whatsappNumber||'',
                instagramHandle: sVals.instagramHandle||''
              },
              categories: categories.map(c => ({id:c.id, name:c.name, emoji:c.emoji||'💎'})),
              products: products
                .filter(p => p.status !== 'archived' && p.status !== 'deleted')
                .map(p => ({
                  id: p.id, name: p.name, productNumber: p.productNumber||'',
                  status: 'active', categoryId: p.categoryId||'', categoryName: p.categoryName||'',
                  description: p.description||'',
                  photos: (p.photos||[]).map(ph=>({data:ph.data||'',color:ph.color||''})),
                  variants: (p.variants||[]).map(v=>({
                    color: v.color||'',
                    sizes: (v.sizes||[]).map(s=>({size:s.size||'',sellPrice:+s.sellingPrice||0,stock:+s.stock||0}))
                  }))
                }))
            });
          }
        };
      });
    },
    setup(data) {
      AP = (data.products||[]).filter(p=>p.status!=='archived'&&p.status!=='deleted');
      _settings = data.settings || {};
      const sn = data.shopName||'Mg Madhuraa Boutique';
      const tg = data.tagline||'';
      const {phone, whatsappNumber, instagramHandle, themeAccent, themeAccent2, themeBg} = _settings;

      const root = document.documentElement;
      if (themeAccent) {
        root.style.setProperty('--acc', themeAccent);
        root.style.setProperty('--glow', themeAccent + '40');
        root.style.setProperty('--bdr2', themeAccent + '50');
      }
      if (themeAccent2) root.style.setProperty('--acc2', themeAccent2);
      if (themeBg && themeBg !== 'dark') {
        const bgs = { midnight:'#0f172a', charcoal:'#1c1c1e', wine:'#1a0008', forest:'#061a06', light:'#f8fafc' };
        const bg2s = { midnight:'#1e293b', charcoal:'#27272a', wine:'#2d0010', forest:'#0a2d0a', light:'#f1f5f9' };
        const cards = { midnight:'#1e293b', charcoal:'#27272a', wine:'#2d0010', forest:'#0a2d0a', light:'#ffffff' };
        const bg = bgs[themeBg]; const bg2 = bg2s[themeBg]; const card = cards[themeBg];
        if (bg) { root.style.setProperty('--bg', bg); document.body.style.background = bg; }
        if (bg2) root.style.setProperty('--bg2', bg2);
        if (card) root.style.setProperty('--card', card);
      }
      
      document.title = sn + ' | Catalog';
      document.getElementById('nbrand').innerHTML = `${e(sn)}<small>${e(tg)}</small>`;
      document.getElementById('fbn').textContent = sn;
      if (tg) document.getElementById('ftg').textContent = tg;
      if (phone) document.getElementById('fph').innerHTML = '📞 ' + phone;
      if (whatsappNumber) document.getElementById('fwa').innerHTML = '💬 ' + whatsappNumber;
      if (instagramHandle) document.getElementById('fig').innerHTML = '📸 @' + instagramHandle;
      
      this.renderCats(data.categories||[]);
      this.renderGrid();
      this.loadIQ();
      this.bind();
    },
    renderCats(cats) {
      const el = document.getElementById('catbar');
      let h = `<button class="cbtn active ripple" data-cat="all">✨ All Collection</button>`;
      cats.forEach(c => h += `<button class="cbtn ripple" data-cat="${e(c.id)}">${e(c.emoji||'💎')} ${e(c.name)}</button>`);
      el.innerHTML = h;
      el.querySelectorAll('.cbtn').forEach(b => {
        b.onclick = () => {
          el.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('active'));
          b.classList.add('active'); this.cat = b.dataset.cat; this.renderGrid();
        };
      });
    },
    buildFilters() {
      const allSizes = [...new Set(AP.flatMap(p=>(p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>s.size))).filter(Boolean))].sort();
      const allColors = [...new Set(AP.flatMap(p=>(p.variants||[]).map(v=>v.color)).filter(Boolean))].sort();
      const drawer = document.getElementById('fdrawer');
      drawer.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div style="font-size:0.8rem; font-weight:800; color:var(--txt); text-transform:uppercase;">✨ Active Filters</div>
          <button onclick="C.clearFilters()" style="background:transparent; border:none; color:#ec4899; font-size:0.75rem; font-weight:700; cursor:pointer;">✕ Clear All</button>
        </div>
        <div class="fgroup">
          <div class="fglabel">📐 Size</div>
          <div class="fchips">${allSizes.length ? allSizes.map(s=>`<button class="fopt${this.filters.sizes.includes(s)?' sel':''}" onclick="C.toggleFSize('${e(s)}')">${e(s)}</button>`).join('') : '<span style="color:var(--txt2);">No sizes</span>'}</div>
        </div>
        ${allColors.length ? `<div class="fdivider"></div>
        <div class="fgroup">
          <div class="fglabel">🎨 Color</div>
          <div class="fchips">${allColors.map(c=>`<button class="fopt${this.filters.colors.includes(c)?' sel':''}" onclick="C.toggleFColor('${e(c)}')"><span class="cdot-f" style="background:${clr(c)}"></span>${e(c)}</button>`).join('')}</div>
        </div>` : ''}
        <div class="fdivider"></div>
        <div class="fgroup">
          <div class="fglabel">💰 Price Range (₹)</div>
          <div class="pr-row">
            <input class="pr-inp" type="number" id="f-minp" placeholder="Min" value="${this.filters.minPrice}" onchange="C.filters.minPrice=this.value;C.renderGrid();C.updateFilterUI()">
            <span style="color:var(--txt2);">—</span>
            <input class="pr-inp" type="number" id="f-maxp" placeholder="Max" value="${this.filters.maxPrice}" onchange="C.filters.maxPrice=this.value;C.renderGrid();C.updateFilterUI()">
          </div>
        </div>
        <div class="fdivider"></div>
        <div class="fgroup">
          <div class="fglabel">✅ Availability</div>
          <div class="avail-toggle">
            <button class="avbtn${this.filters.avail==='all'?' sel':''}" onclick="C.setAvail('all')">All</button>
            <button class="avbtn${this.filters.avail==='in'?' sel':''}" onclick="C.setAvail('in')">In Stock</button>
            <button class="avbtn sel-so${this.filters.avail==='out'?' sel':''}" onclick="C.setAvail('out')">Sold Out</button>
          </div>
        </div>`;
    },
    toggleFilters() {
      this._fopen = !this._fopen;
      const d = document.getElementById('fdrawer');
      const btn = document.getElementById('filter-toggle');
      if (this._fopen) { this.buildFilters(); d.classList.add('open'); btn.classList.add('on'); }
      else { d.classList.remove('open'); btn.classList.remove('on'); }
    },
    toggleFSize(sz) {
      const arr = this.filters.sizes;
      const i = arr.indexOf(sz); if(i>=0) arr.splice(i,1); else arr.push(sz);
      if(this._fopen) this.buildFilters(); this.renderGrid(); this.updateFilterUI();
    },
    toggleFColor(clrV) {
      const arr = this.filters.colors;
      const i = arr.indexOf(clrV); if(i>=0) arr.splice(i,1); else arr.push(clrV);
      if(this._fopen) this.buildFilters(); this.renderGrid(); this.updateFilterUI();
    },
    setAvail(v) { this.filters.avail = v; if(this._fopen) this.buildFilters(); this.renderGrid(); this.updateFilterUI(); },
    setSort(v) { this.sort = v; this.renderGrid(); },
    clearFilters() {
      this.filters = { sizes:[], colors:[], minPrice:'', maxPrice:'', avail:'all' };
      this.sort = ''; document.getElementById('sort-sel').value = '';
      if(this._fopen) this.buildFilters();
      this.renderGrid(); this.updateFilterUI();
    },
    countActiveFilters() {
      const f = this.filters;
      return f.sizes.length + f.colors.length + (f.minPrice?1:0) + (f.maxPrice?1:0) + (f.avail!=='all'?1:0) + (this.sort?1:0);
    },
    updateFilterUI() {
      const cnt = this.countActiveFilters();
      const badge = document.getElementById('factive-cnt');
      const clearBtn = document.getElementById('clear-all-btn');
      const chipsEl = document.getElementById('active-chips');
      if (badge) { badge.style.display = cnt ? 'inline-block' : 'none'; badge.textContent = cnt; }
      if (clearBtn) clearBtn.style.display = cnt ? 'inline-block' : 'none';
      if (!chipsEl) return;
      const chips = [];
      this.filters.sizes.forEach(s => chips.push(`<span class="fchip" onclick="C.toggleFSize('${e(s)}')">📐 ${e(s)} <span class="fx">✕</span></span>`));
      this.filters.colors.forEach(c => chips.push(`<span class="fchip" onclick="C.toggleFColor('${e(c)}')"><span class="cdot-f" style="background:${clr(c)};width:10px;height:10px;"></span>${e(c)} <span class="fx">✕</span></span>`));
      if (this.filters.minPrice) chips.push(`<span class="fchip" onclick="C.filters.minPrice='';C.renderGrid();C.updateFilterUI()">₹≥${this.filters.minPrice} <span class="fx">✕</span></span>`);
      if (this.filters.maxPrice) chips.push(`<span class="fchip" onclick="C.filters.maxPrice='';C.renderGrid();C.updateFilterUI()">₹≤${this.filters.maxPrice} <span class="fx">✕</span></span>`);
      if (this.filters.avail === 'in') chips.push(`<span class="fchip" onclick="C.setAvail('all')">✅ In Stock <span class="fx">✕</span></span>`);
      if (this.filters.avail === 'out') chips.push(`<span class="fchip" onclick="C.setAvail('all')">❌ Sold Out <span class="fx">✕</span></span>`);
      if (this.sort) chips.push(`<span class="fchip" onclick="C.setSort('');document.getElementById('sort-sel').value=''">↕ Sorted <span class="fx">✕</span></span>`);
      chipsEl.innerHTML = chips.join('');
    },
    renderGrid() {
      const grid = document.getElementById('pgrid');
      let fl = [...AP];
      
      if (this.cat !== 'all') {
        fl = fl.filter(p => String(p.categoryId) === String(this.cat) || (p.categoryName||'').toLowerCase() === this.cat.toLowerCase());
      }
      
      if (this.q) {
        const q = this.q.toLowerCase();
        fl = fl.filter(p => {
          const cd = code(p).toLowerCase();
          const colors = (p.variants||[]).map(v=>(v.color||'').toLowerCase()).join(' ');
          const sizes = (p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>(s.size||'').toLowerCase())).join(' ');
          const searchable = [p.name, p.description, p.categoryName, cd, colors, sizes, (p.tags||'')].join(' ').toLowerCase();
          return searchable.includes(q);
        });
      }
      
      if (this.filters.sizes.length) {
        fl = fl.filter(p => {
          const pSizes = (p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>s.size));
          return this.filters.sizes.some(s => pSizes.includes(s));
        });
      }
      
      if (this.filters.colors.length) {
        fl = fl.filter(p => {
          const pCols = (p.variants||[]).map(v=>v.color).filter(Boolean);
          return this.filters.colors.some(c => pCols.includes(c));
        });
      }
      
      const minP2 = this.filters.minPrice ? +this.filters.minPrice : null;
      const maxP2 = this.filters.maxPrice ? +this.filters.maxPrice : null;
      if (minP2 !== null || maxP2 !== null) {
        fl = fl.filter(p => {
          const pr = minP(p);
          if (!pr) return false;
          if (minP2 !== null && pr < minP2) return false;
          if (maxP2 !== null && pr > maxP2) return false;
          return true;
        });
      }
      
      if (this.filters.avail === 'in') fl = fl.filter(p => totS(p) > 0);
      if (this.filters.avail === 'out') fl = fl.filter(p => totS(p) === 0);
      
      if (this.sort === 'name-az') fl.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      else if (this.sort === 'name-za') fl.sort((a,b)=>(b.name||'').localeCompare(a.name||''));
      else if (this.sort === 'price-asc') fl.sort((a,b)=>(minP(a)||0)-(minP(b)||0));
      else if (this.sort === 'price-desc') fl.sort((a,b)=>(minP(b)||0)-(minP(a)||0));
      else if (this.sort === 'newest') fl.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

      const activeF = this.countActiveFilters();
      document.getElementById('pcnt').innerHTML = fl.length
        ? `Showing <span>${fl.length}</span> of <span>${AP.length}</span> styles${activeF ? ` <span style="color:#ec4899;">(${activeF} filter${activeF>1?'s':''})</span>` : ''}`
        : '';
      
      if (!fl.length) return grid.innerHTML = `<div class="state"><h3>💫 No matches found</h3><p>Try a different search or filter</p><button onclick="C.clearFilters()" style="margin-top:16px;padding:10px 24px;background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;border:none;border-radius:20px;font-weight:800;cursor:pointer;font-family:inherit;">✨ Clear Filters</button></div>`;

      grid.innerHTML = fl.map((p, idx) => {
        const pcode = code(p);
        const price = minP(p);
        const ph = p.photos?.[0]?.data;
        const img = ph ? `<img src="${ph}" class="pimg" loading="lazy">` : `<div class="pno-img">👗</div>`;
        const cols = (p.variants||[]).map(v=>v.color).filter(Boolean);
        const dots = cols.slice(0,5).map(c=>`<span class="cdot" style="background:${clr(c)}" title="${e(c)}"></span>`).join('');
        return `
          <div class="pcard" onclick="C.det('${p.id}')" style="animation-delay: ${idx * 0.08}s">
            <div class="pimg-box">
              ${img}
              <div class="pcode">${pcode}</div>
              ${totS(p)===0 ? `<div class="sbadge">Sold Out</div>` : ''}
              <div class="povlay"><button class="qvbtn ripple" onclick="event.stopPropagation();C.det('${p.id}')">✨ View Details</button></div>
            </div>
            <div class="pinfo">
              <div class="pprice">${price ? '₹'+price.toLocaleString('en-IN') : 'Contact'}</div>
              <div class="pcat">${e(p.categoryName||'EXCLUSIVE')}</div>
              <div class="pname">${e(p.name)}</div>
              <div class="cdots">${dots||'<span style="opacity:0">.</span>'}</div>
            </div>
          </div>`;
      }).join('');
    },
    det(id) {
      const p = AP.find(x=>x.id===id); if(!p)return;
      const m = document.getElementById('det-m');
      m.dataset.pid = id; m.dataset.szs = '[]';
      // Trigger sparkle effect on modal open
      const rect = m.getBoundingClientRect();
      createClickSparkles(rect.left + rect.width/2, rect.top + 100);
      createButterfly(rect.left + rect.width/2 - 50, rect.top + 80);
      createButterfly(rect.left + rect.width/2 + 50, rect.top + 60);

      const pcode = code(p);
      const price = minP(p);
      const isSO = totS(p) === 0;
      const allSzs = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>s.size)))];
      const inStk = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).filter(s=>+s.stock>0).map(s=>s.size)))];
      const szShow = isSO ? allSzs : inStk;
      const cols = (p.variants||[]).map(v=>v.color).filter(Boolean);
      const photos = p.photos||[];

      const gall = photos[0] ? `<img src="${photos[0].data}" id="dimg" class="mimg">` : `<div class="mph">👗</div>`;
      const thumbs = photos.length>1 ? `<div class="thumbrow">${photos.map((ph,i)=>`<img src="${ph.data}" class="thumb${i===0?' active':''}" onclick="C.setImg(this)">`).join('')}</div>` : '';
      const szH = szShow.length
        ? szShow.map(s=>`<span class="sz" onclick="C.selSz(this,'${e(s)}')" style="cursor:pointer">${e(s)}</span>`).join('')
        : `<span class="sz" style="opacity:0.5">${isSO ? 'No size info' : 'Contact for sizes'}</span>`;
      const clH = cols.length ? `<div class="colorlist">${cols.map(c=>`<span class="ctag"><span class="cdotl" style="background:${clr(c)}"></span>${e(c)}</span>`).join('')}</div>` : '';

      const actBtns = isSO
        ? `<div style="background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.3);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px;">
            <div style="color:var(--err);font-weight:800;margin-bottom:4px;">❌ Currently Sold Out</div>
            <div style="color:var(--txt2);font-size:0.78rem;">Enquire below — we'll notify you when restocked</div>
           </div>
           <div class="dacts"><button class="btn btn-wa ripple" style="flex:1" onclick="C.soldOutWA('${p.id}')">📩 Enquire on WhatsApp</button></div>`
        : `<div class="dacts">
             <button class="btn btn-p ripple" onclick="C.addIQ('${p.id}')" id="btn-add-${p.id}">💖 Add to Basket</button>
             <button class="btn btn-wa ripple" onclick="C.directWA('${p.id}')">WhatsApp 💬</button>
           </div>`;

      m.innerHTML = `<div class="modal lg">
        <div class="mhdr">
          <div><div class="mcode">Code: ${pcode}${isSO ? ' <span style="background:var(--err);color:#fff;font-size:0.65rem;padding:2px 8px;border-radius:20px;">SOLD OUT</span>' : ''}</div></div>
          <button class="mclose" onclick="C.closeM('det-m')">✕</button>
        </div>
        <div class="mbody">
          <div class="dg">
            <div class="dgal">${gall}${thumbs}</div>
            <div class="dinfo">
              <div>
                <div class="dtag">${e(p.categoryName||'EXCLUSIVE')}</div>
                <div class="dname">${e(p.name)}</div>
                <div class="dprice">${price ? '₹'+price.toLocaleString('en-IN') : 'Ask Price'}</div>
              </div>
              ${p.description ? `<p class="ddesc">${e(p.description)}</p>` : ''}
              ${cols.length ? `<div><div class="sec-t">Available Colors</div>${clH}</div>` : ''}
              <div>
                <div class="sec-t" style="display:flex;align-items:center;gap:8px;">
                  ${isSO ? '📦 Sizes' : '📏 Select Size(s)'}
                  <span id="sz-badge" style="display:none;background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;padding:2px 10px;border-radius:20px;font-size:0.68rem;"></span>
                </div>
                <div class="szrow" id="szrow-${p.id}">${szH}</div>
                ${!isSO && szShow.length ? `<div id="sz-err" style="display:none;color:var(--err);font-size:0.78rem;margin-top:6px;">⚠️ Please select at least one size</div>` : ''}
              </div>
              ${actBtns}
              <div class="share-row" style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bdr);padding-top:16px;">
                <span style="font-size:0.72rem;color:var(--txt2);">🔗 Share:</span>
                <button class="share-btn wa" onclick="C.shareWA('${p.id}')">💬 WhatsApp</button>
                <button class="share-btn fb" onclick="C.shareFB('${p.id}')">📱 Facebook</button>
                <button class="share-btn tw" onclick="C.shareTW('${p.id}')">𝕏 X/Twitter</button>
                <button class="share-btn copy" onclick="C.copyLink('${p.id}')">📋 Copy</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
      m.classList.add('open');
    },
    setImg(t) {
      document.getElementById('dimg').src = t.src;
      document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
    },
    selSz(el, sz) {
      el.classList.toggle('active');
      const m = document.getElementById('det-m');
      let szs = JSON.parse(m.dataset.szs || '[]');
      if (szs.includes(sz)) szs = szs.filter(s=>s!==sz); else szs.push(sz);
      m.dataset.szs = JSON.stringify(szs);
      const badge = document.getElementById('sz-badge');
      if (badge) { badge.style.display = szs.length ? 'inline-block' : 'none'; badge.textContent = szs.length + ' selected'; }
      const err = document.getElementById('sz-err');
      if (err && szs.length) err.style.display = 'none';
      const btn = document.getElementById('btn-add-' + m.dataset.pid);
      if (btn) btn.innerHTML = szs.length ? `💖 Add ${szs.length} Size${szs.length>1?'s':''} to Basket` : '💖 Add to Basket';
    },
    closeM(id) {
      const el=document.getElementById(id); if(el) el.classList.remove('open');
      if(id==='det-m') history.replaceState(null,'',location.href.split('#')[0]);
    },

    loadIQ() { try { const s=localStorage.getItem('bq_bask'); if(s)this.iq=JSON.parse(s); }catch(e){} this.uFAB(); },
    svIQ() { try { localStorage.setItem('bq_bask',JSON.stringify(this.iq)); }catch(e){} this.uFAB(); },
    addIQ(id) {
      const p = AP.find(x=>x.id===id); if(!p) return;
      const m = document.getElementById('det-m');
      const szs = JSON.parse(m.dataset.szs || '[]');
      const availSzs = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).filter(s=>+s.stock>0).map(s=>s.size)))];
      if (availSzs.length > 0 && szs.length === 0) {
        const err = document.getElementById('sz-err');
        if (err) err.style.display = 'block';
        toast('💖 Select at least one size first!'); return;
      }
      const key = p.id + (szs.length ? '|' + [...szs].sort().join(',') : '');
      if (!this.iq.some(x=>x.id===key)) {
        this.iq.push({ id:key, pid:p.id, name:p.name, sizes:szs, code:getRawIdForWA(p), price:minP(p), photo:p.photos?.[0]?.data });
        this.svIQ();
        celebrateBasketAdd(); // 🎉 Trigger celebration!
        toast('✨ Added to your enchanted basket! ✨');
        m.dataset.szs = '[]'; this.closeM('det-m');
      } else toast('💫 Already in your basket!');
    },
    rmIQ(id) { this.iq=this.iq.filter(x=>x.id!==id); this.svIQ(); this.renderIQ(); },
    clearIQ() { this.iq=[]; this.svIQ(); this.closeM('iq-m'); },
    uFAB() {
      const f=document.getElementById('fab'), c=document.getElementById('fcnt');
      if(this.iq.length) { f.classList.remove('hide'); c.textContent=this.iq.length; }
      else f.classList.add('hide');
    },
    renderIQ() {
      const el = document.getElementById('iq-body');
      if(!this.iq.length) return el.innerHTML = `<div class="state"><h3>🛍️ Your Basket is Empty</h3><p>Add some magical pieces!</p></div>`;
      el.innerHTML = this.iq.map(i => {
        const sizes = i.sizes && i.sizes.length ? i.sizes : (i.size ? [i.size] : []);
        const szPills = sizes.map(s=>`<span style="background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;padding:2px 9px;border-radius:20px;font-size:0.7rem;">${e(s)}</span>`).join(' ');
        return `<div class="iqi">
          ${i.photo ? `<img src="${i.photo}" class="iqth">` : `<div class="iqth" style="background:#111;display:flex;align-items:center;justify-content:center;">👗</div>`}
          <div class="iqinfo">
            <div class="iqname">${e(i.name)}</div>
            <div class="iqcode">ID: <b>${e(i.code)}</b></div>
            ${szPills ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:5px 0;">${szPills}</div>` : ''}
            <div style="font-weight:800;color:#ec4899;">${i.price ? '₹'+i.price.toLocaleString('en-IN') : 'Contact'}</div>
          </div>
          <button class="iqrm" onclick="C.rmIQ('${i.id}')">✕</button>
        </div>`;
      }).join('');
    },
    openIQ() { this.renderIQ(); document.getElementById('iq-m').classList.add('open'); },
    _waPhone() {
      const wa = _settings.whatsappNumber || (D&&D.settings&&D.settings.whatsappNumber) || '';
      return wa.replace(/\D/g,'');
    },
    _shopName() { return document.getElementById('fbn')?.textContent?.trim() || 'Boutique'; },
    _div() { return '\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501'; },
    sendWA() {
      if(!this.iq.length) return;
      const ph = this._waPhone();
      const sn = this._shopName();
      let msg = '✨ *' + sn + ' — Order Inquiry*\n\nHello! I would like to inquire about:\n' + this._div() + '\n\n';
      this.iq.forEach((i, idx) => {
        const sizes = i.sizes && i.sizes.length ? i.sizes : (i.size ? [i.size] : []);
        msg += (idx+1) + '. *' + i.name + '*\n';
        msg += '   🏷️ Code: *' + i.code + '*\n';
        if (sizes.length) msg += '   📏 Size' + (sizes.length>1?'s':'') + ': *' + sizes.join(', ') + '*\n';
        if (i.price) msg += '   💰 ₹' + i.price.toLocaleString('en-IN') + '\n';
        msg += '\n';
      });
      msg += this._div() + '\n📦 Total: *' + this.iq.length + ' item' + (this.iq.length>1?'s':'') + '*\n_Please confirm availability & pricing._\n_Thank you! 🙏✨_';
      window.open((ph ? 'https://wa.me/'+ph : 'https://wa.me/') + '?text=' + encodeURIComponent(msg), '_blank');
    },
    directWA(id) {
      const p = AP.find(x=>x.id===id); if(!p) return;
      const ph = this._waPhone();
      const m = document.getElementById('det-m');
      const szs = JSON.parse(m?.dataset.szs || '[]');
      
      const availSzs = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).filter(s=>+s.stock>0).map(s=>s.size)))];
      if (availSzs.length > 0 && szs.length === 0) {
        toast('💖 Please select a size first!'); return;
      }

      const sn = this._shopName();
      let msg = '✨ *' + sn + ' — Product Inquiry*\n\nHello! I\'m interested in:\n' + this._div() + '\n\n';
      msg += '📦 *' + p.name + '*\n🏷️ Code: *' + getRawIdForWA(p) + '*\n';
      if (szs.length) msg += '📏 Size' + (szs.length>1?'s':'') + ': *' + szs.join(', ') + '*\n';
      if (minP(p)) msg += '💰 Price: ₹' + minP(p).toLocaleString('en-IN') + '\n';
      msg += '\n' + this._div() + '\n_Please confirm availability & pricing._\n_Thank you! 🙏✨_';
      window.open((ph ? 'https://wa.me/'+ph : 'https://wa.me/') + '?text=' + encodeURIComponent(msg), '_blank');
    },
    soldOutWA(id) {
      const p = AP.find(x=>x.id===id); if(!p) return;
      const ph = this._waPhone();
      const sn = this._shopName();
      let msg = '✨ *' + sn + ' — Sold Out Inquiry*\n\nHello! I\'m interested in a sold-out item:\n' + this._div() + '\n\n';
      msg += '📦 *' + p.name + '*\n🏷️ Code: *' + getRawIdForWA(p) + '*\n';
      msg += '\n' + this._div() + '\n❓ *When will this be restocked?*\n_If you have a similar style, please let me know too!_\n_Thank you! 🙏✨_';
      window.open((ph ? 'https://wa.me/'+ph : 'https://wa.me/') + '?text=' + encodeURIComponent(msg), '_blank');
    },
    _productURL(id) {
      const base = location.href.split('#')[0];
      return base + '#' + encodeURIComponent(id);
    },
    shareWA(id) {
      const p = AP.find(x=>x.id===id); if(!p) return;
      const sn = this._shopName();
      const url = this._productURL(id);
      let msg = '✨ *' + sn + '* — Check out this product!\n\n';
      msg += '📦 *' + p.name + '*\n🏷️ Code: *' + getRawIdForWA(p) + '*\n';
      if (minP(p)) msg += '💰 Price: ₹' + minP(p).toLocaleString('en-IN') + '\n';
      msg += '\n🔗 View: ' + url;
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    },
    shareFB(id) {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(this._productURL(id)), '_blank');
    },
    shareTW(id) {
      const p = AP.find(x=>x.id===id); if(!p) return;
      const txt = 'Check out ' + p.name + ' at Mg Madhuraa Boutique!';
      window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(txt) + '&url=' + encodeURIComponent(this._productURL(id)), '_blank');
    },
    copyLink(id) {
      const url = this._productURL(id);
      navigator.clipboard?.writeText(url).then(() => toast('✨ Link copied!')).catch(() => {
        const ta = document.createElement('textarea'); ta.value = url;
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        toast('✨ Link copied!');
      });
    },
    bind() {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (hash) {
        const p = AP.find(x=>x.id===hash);
        if (p) setTimeout(()=>this.det(hash), 300);
      }
      
      const tips = ['Search for Gowns...','Search for Sarees...','Search for Lehengas...','Search for Kurtis...','Search ID: MGB...'];
      let ti=0, char=0, isRm=false;
      const type = () => {
        const inp = document.getElementById('sinput'); if(!inp) return;
        const full = tips[ti];
        if(!isRm) {
          inp.placeholder = full.substring(0, char++);
          if(char > full.length) { isRm=true; setTimeout(type, 2000); } else setTimeout(type, 100);
        } else {
          inp.placeholder = full.substring(0, char--);
          if(char === 0) { isRm=false; ti=(ti+1)%tips.length; setTimeout(type, 500); } else setTimeout(type, 50);
        }
      };
      type();

      document.getElementById('sinput').oninput = ev => {
        const val = ev.target.value.trim().toLowerCase();
        this.q = val;
        const resEl = document.getElementById('ss-results');
        if(!val) { resEl.style.display='none'; this.renderGrid(); return; }
        
        const matches = AP.filter(p => {
          const cd = code(p).toLowerCase();
          const colors = (p.variants||[]).map(v=>(v.color||'').toLowerCase()).join(' ');
          const searchable = [p.name, p.description, p.categoryName, cd, colors].join(' ').toLowerCase();
          return searchable.includes(val);
        }).slice(0, 5);

        if(matches.length) {
          resEl.innerHTML = matches.map(p => `
            <div class="ss-item" onclick="C.det('${p.id}'); document.getElementById('ss-results').style.display='none';">
              <img src="${p.photos?.[0]?.data || ''}" class="ss-img">
              <div class="ss-info">
                <div class="ss-name">${e(p.name)}</div>
                <div class="ss-price">₹${minP(p).toLocaleString()}</div>
              </div>
            </div>
          `).join('');
          resEl.style.display = 'block';
        } else {
          resEl.style.display = 'none';
        }
        this.renderGrid();
      };

      document.addEventListener('click', ev => {
        if(!ev.target.closest('.srchwrap')) document.getElementById('ss-results').style.display='none';
      });

      document.getElementById('fab').onclick = () => this.openIQ();
      ['iq-m','det-m'].forEach(id=>{ document.getElementById(id).onclick = ev => { if(ev.target.id===id) this.closeM(id); }});
      document.addEventListener('keydown', ev => {
        if(ev.key==='Escape'){
          this.closeM('det-m');
          history.replaceState(null,'',location.href.split('#')[0]);
          this.closeM('iq-m');
        }
      });
    }
  };
  document.addEventListener('DOMContentLoaded', ()=>C.init());
  window.C = C;
})();
</script>
</body>
</html>
