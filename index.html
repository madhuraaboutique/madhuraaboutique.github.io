<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="Browse Mg Madhuraa Boutique's premium product catalog — search, filter, and inquire via WhatsApp.">
<title>Mg Madhuraa Boutique | Catalog ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:#0a0a0f;color:#f8fafc;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;cursor:default;}
:root{--bg:#0a0a0f;--bg2:#1a1a2e;--card:#16213e;--acc:#ff6b9d;--acc2:#c44569;--gold:#f9ca24;--glow:rgba(255,107,157,0.3);--txt:#f8fafc;--txt2:#b8b8d0;--muted:#4a4a6a;--err:#ff4757;--ok:#2ed573;--bdr:rgba(255,255,255,0.1);--bdr2:rgba(255,107,157,0.4);--r:16px;--r2:24px;--rf:9999px;--sh:0 20px 40px rgba(0,0,0,0.5);--tr:all 0.4s cubic-bezier(0.4,0,0.2,1)}

/* ⭐ LUXURIOUS FLOATING PARTICLES */
.particle-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.particle {
  position: absolute;
  border-radius: 50%;
  animation: floatUp linear infinite;
  opacity: 0;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 0.8; }
  100% { transform: translateY(-10vh) scale(1.5) rotate(720deg); opacity: 0; }
}

/* ⭐ HEART SHAPED PARTICLES */
.heart-particle {
  position: absolute;
  animation: heartFloat linear infinite;
  pointer-events: none;
  z-index: 1;
}

@keyframes heartFloat {
  0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
  20% { opacity: 0.9; }
  80% { opacity: 0.7; }
  100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
}

/* ⭐ SHIMMER OVERLAY */
.shimmer-overlay {
  position: fixed;
  top: 0; left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
  animation: shimmerSweep 8s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes shimmerSweep {
  0% { left: -100%; }
  100% { left: 200%; }
}

/* ⭐ DIAMOND SPARKLE */
.diamond-sparkle {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  animation: diamondPop 2s ease-out forwards;
}

@keyframes diamondPop {
  0% { transform: scale(0) rotate(0deg); opacity: 1; }
  50% { transform: scale(1) rotate(180deg); opacity: 0.8; }
  100% { transform: scale(0) rotate(360deg); opacity: 0; }
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--acc), var(--acc2)); border-radius: var(--rf); }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

/* ═══ NAVBAR ═══ */
.topnav{
  position:sticky;
  top:0;
  z-index:200;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  gap:15px;
  background:rgba(10,10,15,0.85);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border-bottom:2px solid var(--bdr);
  animation: slideDown 0.8s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 10px 30px rgba(255,107,157,0.1);
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.brand{
  font-family: 'Playfair Display', serif;
  font-size:1.6rem;
  font-weight:700;
  font-style: italic;
  background:linear-gradient(135deg, #fff 0%, #ff6b9d 30%, #f9ca24 60%, #ff6b9d 100%);
  background-size: 200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  white-space:nowrap;
  flex-shrink:0;
  line-height:1.1;
  animation: brandShine 3s ease-in-out infinite, slideDown 0.8s ease-out;
  position: relative;
}

@keyframes brandShine {
  0%, 100% { background-position: 0% center; filter: brightness(1); }
  50% { background-position: 100% center; filter: brightness(1.2); }
}

.brand::after {
  content: '✨';
  position: absolute;
  top: -10px;
  right: -20px;
  font-size: 14px;
  -webkit-text-fill-color: initial;
  animation: sparkleTwinkle 1.5s ease-in-out infinite;
}

@keyframes sparkleTwinkle {
  0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
}

.brand small{
  display:block;
  font-family: 'Outfit', sans-serif;
  font-size:0.6rem;
  font-style: normal;
  -webkit-text-fill-color:var(--gold);
  font-weight:500;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-top:2px;
  animation: tagSlide 0.6s ease-out 0.3s both;
}

@keyframes tagSlide {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.srchwrap{
  flex:1;
  position:relative;
  max-width:400px;
  margin:0;
  padding:2px;
  border-radius:var(--rf);
  background:linear-gradient(135deg, #ff6b9d, #f9ca24, #ff6b9d);
  background-size:200% 100%;
  animation: gradientMove 6s ease infinite, searchAppear 0.6s ease-out 0.2s both;
  z-index:1;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes searchAppear {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.srchwrap::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--rf);
  box-shadow:0 0 30px rgba(255,107,157,0.3);
  pointer-events:none;
}

.srchwrap input{
  width:100%;
  height:42px;
  padding:0 16px 0 48px;
  background:#0a0a0f;
  border:none;
  border-radius:var(--rf);
  color:var(--txt);
  font-family:inherit;
  font-size:0.92rem;
  transition:var(--tr);
  display:block;
}

.srchwrap input:focus{
  outline:none;
  background:#111;
  box-shadow: 0 0 30px rgba(255,107,157,0.3);
}

.srchwrap:focus-within{
  animation-duration:3s;
  transform: scale(1.03);
}

.srchwrap .si{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:1.2rem;
  pointer-events:none;
  z-index:2;
  transition:var(--tr);
  filter: grayscale(0.5);
}

.srchwrap:focus-within .si{
  filter: grayscale(0);
  transform:translateY(-50%) scale(1.3) rotate(15deg);
}

.srch-extra{display:flex;align-items:center;gap:12px;animation: fadeIn 0.6s ease-out 0.4s both;}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.fbtn-mini{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 20px;
  background:var(--bg2);
  border:1.5px solid var(--bdr2);
  border-radius:var(--rf);
  color:#fff;
  font-size:0.85rem;
  font-weight:600;
  cursor:pointer;
  transition:var(--tr);
  font-family:inherit;
  position: relative;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.fbtn-mini::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,107,157,0.2), transparent);
  transition: 0.6s;
}

.fbtn-mini:hover::before {
  left: 100%;
}

.fbtn-mini:hover{
  border-color:var(--acc);
  background:rgba(255,107,157,0.1);
  transform:translateY(-3px) scale(1.05);
  box-shadow: 0 10px 30px rgba(255,107,157,0.3);
}

.fbtn-mini.on{
  background:linear-gradient(135deg, var(--acc), var(--acc2));
  border-color:transparent;
  color:#fff;
  box-shadow:0 0 30px rgba(255,107,157,0.5);
  animation: glamPulse 2s ease-in-out infinite;
}

@keyframes glamPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(255,107,157,0.3); }
  50% { box-shadow: 0 0 40px rgba(255,107,157,0.6); }
}

.sort-mini{
  background:var(--bg2);
  border:1.5px solid var(--bdr);
  border-radius:var(--r);
  color:var(--txt);
  font-size:0.85rem;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  outline:none;
  padding:10px 14px;
  transition:var(--tr);
  max-width:130px;
}

.sort-mini:hover{
  border-color:var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(249,202,36,0.2);
}

/* ⭐ GLAM FAB BUTTON */
.fab{
  position:relative;
  flex-shrink:0;
  height:45px;
  padding:0 18px;
  background:linear-gradient(135deg, #ff6b9d, #c44569);
  border-radius:var(--rf);
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  border:none;
  font-size:0.9rem;
  font-weight:700;
  color:#fff;
  transition:var(--tr);
  box-shadow:0 5px 20px rgba(255,107,157,0.4);
  font-family:inherit;
  animation: floatGentle 4s ease-in-out infinite;
}

@keyframes floatGentle {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-5px) rotate(2deg); }
  75% { transform: translateY(-8px) rotate(-2deg); }
}

.fab:hover{
  transform:translateY(-3px) scale(1.1);
  box-shadow:0 8px 30px rgba(255,107,157,0.6);
  animation: none;
}

.fab::after {
  content: '';
  position: absolute;
  top: -5px; left: -5px;
  right: -5px; bottom: -5px;
  border-radius: var(--rf);
  background: transparent;
  border: 2px solid rgba(255,107,157,0.3);
  animation: rippleOut 2s ease-out infinite;
}

@keyframes rippleOut {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(1.3); opacity: 0; }
}

.fab.hide{display:none}

.fbadge{
  background:#fff;
  color:#c44569;
  font-size:0.75rem;
  font-weight:800;
  padding:2px 8px;
  border-radius:var(--rf);
  min-width:24px;
  text-align:center;
  animation: heartBeat 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
}

@keyframes heartBeat {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* ═══ CATEGORY BAR ═══ */
.catbar{
  position:sticky;
  top:75px;
  z-index:190;
  background:rgba(10,10,15,0.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
  padding:10px 25px;
  display:flex;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

.catbar::-webkit-scrollbar{display:none}

.cbtn{
  flex-shrink:0;
  padding:10px 22px;
  background:var(--bg2);
  border:1.5px solid var(--bdr);
  border-radius:var(--rf);
  color:var(--txt2);
  font-size:0.88rem;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:var(--tr);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:8px;
  position: relative;
  overflow: hidden;
}

.cbtn::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(255,107,157,0.1), rgba(249,202,36,0.1));
  opacity: 0;
  transition: opacity 0.3s;
}

.cbtn:hover::before {
  opacity: 1;
}

.cbtn:hover{
  border-color:var(--acc);
  color:#fff;
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(255,107,157,0.2);
}

.cbtn.active{
  background:linear-gradient(135deg, #ff6b9d, #c44569);
  color:#fff;
  border-color:transparent;
  box-shadow:0 5px 20px rgba(255,107,157,0.4);
  animation: glamPulse 3s ease-in-out infinite;
}

/* ⭐ ELEGANT MAIN SECTION */
.main{
  padding:20px 25px 80px;
  max-width: 1600px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.pbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  padding: 0 5px;
}

.pcnt{
  font-size:0.9rem;
  color:var(--txt2);
  font-weight:500;
  letter-spacing:0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.pcnt span{
  color:var(--txt);
  font-weight:700;
  background:linear-gradient(135deg, rgba(255,107,157,0.2), rgba(196,69,105,0.2));
  padding:3px 12px;
  border-radius:var(--rf);
  border:1px solid var(--bdr2);
}

/* ⭐ LUXURIOUS PRODUCT GRID */
.pgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));
  gap:28px;
}

@media(max-width: 500px) {
  .pgrid{grid-template-columns:repeat(2, 1fr);gap:14px}
}

/* ⭐ GLAMOROUS PRODUCT CARD */
.pcard{
  background:linear-gradient(145deg, #1a1a2e, #16213e);
  border-radius:var(--r2);
  overflow:hidden;
  border:1.5px solid var(--bdr);
  transition:var(--tr);
  cursor:pointer;
  position:relative;
  display:flex;
  flex-direction:column;
  opacity: 0;
  animation: cardReveal 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

@keyframes cardReveal {
  from { opacity: 0; transform: translateY(40px) scale(0.9) rotateY(10deg); }
  to { opacity: 1; transform: translateY(0) scale(1) rotateY(0); }
}

.pcard:hover{
  transform:translateY(-15px) scale(1.03) rotateY(-5deg);
  border-color:var(--bdr2);
  box-shadow: 0 30px 60px rgba(255,107,157,0.2), 0 0 80px rgba(255,107,157,0.1);
  z-index: 10;
}

/* ⭐ Card Shine Effect */
.pcard::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent 40%,
    rgba(255,255,255,0.03) 45%,
    rgba(255,255,255,0.08) 50%,
    rgba(255,255,255,0.03) 55%,
    transparent 60%
  );
  transform: rotate(25deg);
  transition: 0.6s;
  pointer-events: none;
  z-index: 1;
}

.pcard:hover::after {
  transform: rotate(25deg) translate(50%, -50%);
}

.pimg-box{
  position:relative;
  overflow:hidden;
  background: var(--bg);
  display:block;
}

.pimg{
  width:100%;
  height:auto;
  display:block;
  transition:transform 1s cubic-bezier(0.4,0,0.2,1);
}

.pcard:hover .pimg{transform:scale(1.12) rotate(1deg)}

.pno-img{
  width:100%;
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:5rem;
  opacity:0.15;
  animation: iconSway 4s ease-in-out infinite;
}

@keyframes iconSway {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

.pcode{
  position:absolute;
  top:14px;
  left:14px;
  z-index:2;
  padding:5px 12px;
  border-radius:8px;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(10px);
  font-size:0.75rem;
  font-weight:700;
  color:#fff;
  letter-spacing:1px;
  border:1px solid rgba(255,255,255,0.2);
  transition: all 0.3s;
}

.pcard:hover .pcode {
  background: rgba(255,107,157,0.85);
  border-color: var(--gold);
  box-shadow: 0 5px 15px rgba(255,107,157,0.4);
}

.sbadge{
  position:absolute;
  top:14px;
  right:14px;
  z-index:2;
  background:rgba(255,71,87,0.9);
  color:#fff;
  padding:5px 12px;
  border-radius:8px;
  font-size:0.7rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.5px;
  backdrop-filter:blur(6px);
  animation: urgentShake 0.6s ease-in-out infinite;
}

@keyframes urgentShake {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-3deg); }
  75% { transform: rotate(3deg); }
}

.povlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0) 50%);
  display:flex;
  align-items:flex-end;
  padding:20px;
  opacity:0;
  transition:var(--tr);
}

.pcard:hover .povlay{opacity:1}

.qvbtn{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg, #fff, #f0f0f0);
  color:#c44569;
  border:none;
  border-radius:var(--r);
  font-size:0.85rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
  cursor:pointer;
  font-family:inherit;
  transition:var(--tr);
  transform: translateY(30px);
  transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
}

.pcard:hover .qvbtn {
  transform: translateY(0);
}

.qvbtn:hover{
  background:linear-gradient(135deg, #ff6b9d, #c44569);
  color:#fff;
  transform:scale(1.08) translateY(-5px);
  box-shadow: 0 15px 30px rgba(255,107,157,0.5);
}

.pinfo{
  padding:18px;
  display:flex;
  flex-direction:column;
  flex:1;
  position: relative;
  z-index: 2;
}

.pcat{
  font-family: 'Outfit', sans-serif;
  font-size:0.65rem;
  text-transform:uppercase;
  letter-spacing:2.5px;
  color:var(--gold);
  font-weight:700;
  margin-bottom:6px;
  transition: all 0.3s;
}

.pname{
  font-family: 'Playfair Display', serif;
  font-size:1.15rem;
  font-weight:600;
  color:var(--txt);
  margin-bottom:10px;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.cdots{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
  min-height:18px;
  align-items:center;
}

.cdot{
  width:16px;
  height:16px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.3);
  box-shadow:0 3px 8px rgba(0,0,0,0.5);
  transition: transform 0.3s;
}

.pcard:hover .cdot {
  transform: scale(1.3) rotate(45deg);
}

.pprice{
  font-family: 'Outfit', sans-serif;
  font-size:1.8rem;
  font-weight:900;
  letter-spacing:0.5px;
  margin-bottom:6px;
  background: linear-gradient(135deg, #fff 0%, #ff6b9d 40%, #f9ca24 70%, #fff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: priceShine 4s linear infinite;
}

@keyframes priceShine {
  to { background-position: 200% center; }
}

/* ⭐ MODALS */
.mover{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  overscroll-behavior:contain;
  opacity:0;
  transition:opacity 0.4s ease;
}

.mover.open{
  display:flex;
  opacity:1;
}

.modal{
  background:linear-gradient(145deg, #1a1a2e, #16213e);
  width:100%;
  border-radius:28px;
  border:2px solid var(--bdr);
  overflow:hidden;
  max-height:90vh;
  display:flex;
  flex-direction:column;
  transform:scale(0.9) translateY(30px);
  transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 30px 60px rgba(0,0,0,0.8), 0 0 100px rgba(255,107,157,0.15);
}

.mover.open .modal{
  transform:scale(1) translateY(0);
  animation: modalGlam 0.7s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes modalGlam {
  0% { transform: scale(0.85) translateY(40px) rotateX(10deg); }
  60% { transform: scale(1.02) translateY(-10px) rotateX(-2deg); }

(function () {
  'use strict';
  let D = window.__D__ || null;
  let AP = [];
  let _settings = {};

  // ⭐ ULTRA GLAM PARTICLE SYSTEM
  function createGlamParticles() {
    const container = document.getElementById('particle-bg');
    if (!container) return;

    // Diamond sparkles
    const diamonds = ['💎', '✨', '💖', '⭐', '💫', '🌟', '💝', '🎀'];
    
    setInterval(() => {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      const size = Math.random() * 8 + 4;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      
      const colors = ['#ff6b9d', '#f9ca24', '#fff', '#ff85a2', '#ffd700', '#ff69b4'];
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      particle.style.boxShadow = `0 0 ${size*2}px ${particle.style.background}`;
      
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 8 + 6) + 's';
      particle.style.animationDelay = (Math.random() * 2) + 's';
      
      container.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) particle.parentNode.removeChild(particle);
      }, 10000);
    }, 150);

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.textContent = diamonds[Math.floor(Math.random() * diamonds.length)];
      heart.style.left = Math.random() * 95 + '%';
      heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
      heart.style.animationDuration = (Math.random() * 10 + 8) + 's';
      heart.style.animationDelay = (Math.random() * 3) + 's';
      
      container.appendChild(heart);
      
      setTimeout(() => {
        if (heart.parentNode) heart.parentNode.removeChild(heart);
      }, 14000);
    }, 500);
  }

  // ⭐ CURSOR DIAMOND TRAIL
  let mouseTrailTimeout;
  document.addEventListener('mousemove', (e) => {
    clearTimeout(mouseTrailTimeout);
    mouseTrailTimeout = setTimeout(() => {
      const sparkle = document.createElement('div');
      sparkle.className = 'diamond-sparkle';
      sparkle.textContent = '✨';
      sparkle.style.left = (e.clientX - 10) + 'px';
      sparkle.style.top = (e.clientY - 10) + 'px';
      sparkle.style.fontSize = (Math.random() * 15 + 10) + 'px';
      document.body.appendChild(sparkle);
      
      setTimeout(() => {
        if (sparkle.parentNode) sparkle.parentNode.removeChild(sparkle);
      }, 2000);
    }, 50);
  });

  function e(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function pad(n) { return String(n||'').padStart(3, '0'); }
  function code(p) { return p.productNumber ? '#' + pad(p.productNumber) : 'ID: ' + p.id.substring(0, 6).toUpperCase(); }
  function getRawIdForWA(p) { return p.productNumber ? '#' + pad(p.productNumber) : p.id.substring(0,6).toUpperCase(); }

  function minP(p) {
    if (!p.variants||!p.variants.length) return 0;
    let m = Infinity;
    p.variants.forEach(v=>(v.sizes||[]).forEach(s=>{if(+s.sellPrice<m)m=+s.sellPrice;}));
    return m===Infinity?0:m;
  }
  function totS(p) { let t=0; (p.variants||[]).forEach(v=>(v.sizes||[]).forEach(s=>{t+=parseFloat(s.stock)||0;})); return t; }
  function clr(n) {
    const m = {red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#eab308',pink:'#ec4899',purple:'#a855f7',orange:'#f97316',white:'#f1f5f9',black:'#111',grey:'#9ca3af',maroon:'#881337',navy:'#1e3a5f'};
    for (const [k, v] of Object.entries(m)) if((n||'').toLowerCase().includes(k)) return v;
    return n||'#ff6b9d';

  }

  const C = {
    cat: 'all', q: '', iq: [], _t: null,

            clearTimeout(safetyTimer);
            if (lsMeta) {
              idbData.shopName = lsMeta.shopName || idbData.shopName;
              idbData.tagline = lsMeta.tagline || idbData.tagline;
              if (lsMeta.settings) Object.assign(idbData.settings, lsMeta.settings);
              if (lsMeta.categories && lsMeta.categories.length) idbData.categories = lsMeta.categories;
            }
            this.setup(idbData); return;
          }
        } catch(e) {}
        try {
          const r = await fetch('data/products.json?v='+Date.now());
          if (r.ok) {
            const json = await r.json();
            if (json && json.products && json.products.length > 0) { clearTimeout(safetyTimer); this.setup(json); return; }
          }
        } catch(e) {}
        clearTimeout(safetyTimer);
        document.getElementById('pgrid').innerHTML = this._noDataMsg();
      } catch(err) {
        clearTimeout(safetyTimer);
        document.getElementById('pgrid').innerHTML = this._noDataMsg();
      }
    },

    _loadFromIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('BoutiqueManagerV2');
        req.onerror = () => reject(new Error('IDB unavailable'));
        req.onsuccess = (ev) => {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains('products')) { db.close(); return reject(new Error('No products store')); }
          const storeNames = ['products','categories','settings'].filter(s => db.objectStoreNames.contains(s));
          const tx = db.transaction(storeNames, 'readonly');
          let products = [], categories = [];
          let sVals = {}, sExpected = 0, sDone = 0;
          const sKeys = ['shopName','shopInitials','tagline','phone','whatsappNumber','instagramHandle'];
          const pReq = tx.objectStore('products').getAll();
          const cReq = storeNames.includes('categories') ? tx.objectStore('categories').getAll() : null;
          if (storeNames.includes('settings')) {
            sExpected = sKeys.length;
            sKeys.forEach(k => {
              const gr = tx.objectStore('settings').get(k);
              gr.onsuccess = () => { sVals[k] = gr.result ? gr.result.value : ''; sDone++; tryFinish(); };
            });
          }
          tx.onerror = () => reject(new Error('IDB tx error'));
          let pOk=false, cOk=!cReq;
          pReq.onsuccess = () => { products = pReq.result||[]; pOk=true; tryFinish(); };
          if (cReq) cReq.onsuccess = () => { categories = cReq.result||[]; cOk=true; tryFinish(); };
          else tryFinish();
          function tryFinish() {
            if (!pOk || !cOk || sDone < sExpected) return;
            db.close();
            resolve({
              shopName: sVals.shopName || 'Boutique', tagline: sVals.tagline || '',
              settings: { shopInitials: sVals.shopInitials||'RB', phone: sVals.phone||'', whatsappNumber: sVals.whatsappNumber||'', instagramHandle: sVals.instagramHandle||'' },
              categories: categories.map(c => ({id:c.id, name:c.name, emoji:c.emoji||'💎'})),
              products: products.filter(p => p.status !== 'archived' && p.status !== 'deleted').map(p => ({
                id: p.id, name: p.name, productNumber: p.productNumber||'', status: 'active', categoryId: p.categoryId||'', categoryName: p.categoryName||'', description: p.description||'',
                photos: (p.photos||[]).map(ph=>({data:ph.data||'',color:ph.color||''})),
                variants: (p.variants||[]).map(v=>({ color: v.color||'', sizes: (v.sizes||[]).map(s=>({size:s.size||'',sellPrice:+s.sellingPrice||0,stock:+s.stock||0})) }))
              }))
            });
          }
        };
      });
    },
    setup(data) {
      AP = (data.products||[]).filter(p=>p.status!=='archived'&&p.status!=='deleted');
      _settings = data.settings || {};
      const sn = data.shopName||'Mg Madhuraa Boutique';
      const tg = data.tagline||'';
      const {phone, whatsappNumber, instagramHandle, themeAccent, themeAccent2, themeBg} = _settings;
      const root = document.documentElement;
      if (themeAccent) { root.style.setProperty('--acc', themeAccent); root.style.setProperty('--glow', themeAccent + '40'); root.style.setProperty('--bdr2', themeAccent + '50'); }
      if (themeAccent2) root.style.setProperty('--acc2', themeAccent2);
      document.title = sn + ' | Luxe Catalog ✨';
      document.getElementById('nbrand').innerHTML = `${e(sn)}<small>${e(tg)}</small>`;
      document.getElementById('fbn').textContent = sn;
      if (tg) document.getElementById('ftg').textContent = tg;
      if (phone) document.getElementById('fph').innerHTML = '📞 ' + phone;
      if (whatsappNumber) document.getElementById('fwa').innerHTML = '💬 ' + whatsappNumber;
      if (instagramHandle) document.getElementById('fig').innerHTML = '📸 @' + instagramHandle;
      this.renderCats(data.categories||[]);
      this.renderGrid();
      this.loadIQ();
      this.bind();
    },
    renderCats(cats) {
      const el = document.getElementById('catbar');
      let h = `<button class="cbtn active" data-cat="all">✨ All Collection</button>`;
      cats.forEach(c => h += `<button class="cbtn" data-cat="${e(c.id)}">${e(c.emoji||'💎')} ${e(c.name)}</button>`);
      el.innerHTML = h;
      el.querySelectorAll('.cbtn').forEach(b => {
        b.onclick = () => { el.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); this.cat = b.dataset.cat; this.renderGrid(); };
      });
    },
    renderGrid() {
      const grid = document.getElementById('pgrid');
      let fl = [...AP];
      if (this.cat !== 'all') fl = fl.filter(p => String(p.categoryId) === String(this.cat) || (p.categoryName||'').toLowerCase() === this.cat.toLowerCase());
      if (this.q) {
        const q = this.q.toLowerCase();
        fl = fl.filter(p => {
          const cd = code(p).toLowerCase();
          const colors = (p.variants||[]).map(v=>(v.color||'').toLowerCase()).join(' ');
          const sizes = (p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>(s.size||'').toLowerCase())).join(' ');
          return [p.name, p.description, p.categoryName, cd, colors, sizes].join(' ').toLowerCase().includes(q);
        });
      }
      if (this.filters.sizes.length) fl = fl.filter(p => this.filters.sizes.some(s => (p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>s.size)).includes(s)));
      if (this.filters.colors.length) fl = fl.filter(p => this.filters.colors.some(c => (p.variants||[]).map(v=>v.color).filter(Boolean).includes(c)));
      const minP2 = this.filters.minPrice ? +this.filters.minPrice : null;
      const maxP2 = this.filters.maxPrice ? +this.filters.maxPrice : null;
      if (minP2 !== null || maxP2 !== null) fl = fl.filter(p => { const pr = minP(p); if (!pr) return false; if (minP2 !== null && pr < minP2) return false; if (maxP2 !== null && pr > maxP2) return false; return true; });
      if (this.filters.avail === 'in') fl = fl.filter(p => totS(p) > 0);
      if (this.filters.avail === 'out') fl = fl.filter(p => totS(p) === 0);
      if (this.sort === 'name-az') fl.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      else if (this.sort === 'name-za') fl.sort((a,b)=>(b.name||'').localeCompare(a.name||''));
      else if (this.sort === 'price-asc') fl.sort((a,b)=>(minP(a)||0)-(minP(b)||0));
      else if (this.sort === 'price-desc') fl.sort((a,b)=>(minP(b)||0)-(minP(a)||0));
      else if (this.sort === 'newest') fl.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
      document.getElementById('pcnt').innerHTML = fl.length ? `Showing <span>${fl.length}</span> of <span>${AP.length}</span> treasures` : '';
      if (!fl.length) return grid.innerHTML = `<div class="state"><h3>💫 No matches found</h3><p>Try adjusting your search, darling!</p><button onclick="C.clearFilters()" style="margin-top:16px;padding:12px 28px;background:linear-gradient(135deg, #ff6b9d, #c44569);color:#fff;border:none;border-radius:50px;font-weight:800;cursor:pointer;font-family:inherit;font-size:0.9rem;">✨ Clear All Filters</button></div>`;
      
      grid.innerHTML = fl.map((p, idx) => {
        const pcode = code(p);
        const price = minP(p);
        const ph = p.photos?.[0]?.data;
        const img = ph ? `<img src="${ph}" class="pimg" loading="lazy">` : `<div class="pno-img">👗</div>`;
        const cols = (p.variants||[]).map(v=>v.color).filter(Boolean);
        const dots = cols.slice(0,5).map(c=>`<span class="cdot" style="background:${clr(c)}" title="${e(c)}"></span>`).join('');
        const pSizes = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).filter(s=>+s.stock>0).map(s=>s.size)))];
        const szPrev = pSizes.slice(0,4).map(s=>`<span style="font-size:0.65rem;padding:3px 8px;background:rgba(255,255,255,0.05);border:1px solid var(--bdr);border-radius:20px;color:var(--txt2);font-weight:700;">${e(s)}</span>`).join('');
        const isNew = idx < 3; // First 3 items get "New" ribbon
        
        return `
          <div class="pcard" onclick="C.det('${p.id}')" style="animation-delay: ${idx * 0.1}s">
            <div class="pimg-box">
              ${img}
              ${isNew ? '<div class="special-ribbon">NEW</div>' : ''}
              <div class="pcode">${pcode}</div>
              <div class="wishlist-heart" onclick="event.stopPropagation();this.classList.toggle('liked')">🤍</div>
              ${totS(p)===0 ? `<div class="sbadge">Sold Out</div>` : ''}
              <div class="povlay"><button class="qvbtn" onclick="event.stopPropagation();C.det('${p.id}')">✨ View Details</button></div>
            </div>
            <div class="pinfo">
              <div class="pprice">${price ? '₹'+price.toLocaleString('en-IN') : 'Contact'}</div>
              <div class="pcat">${e(p.categoryName||'EXCLUSIVE')}</div>
              <div class="pname">${e(p.name)}</div>
              <div class="cdots">${dots||'<span style="opacity:0">.</span>'}</div>
              <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;min-height:20px;">${szPrev}</div>
            </div>
          </div>`;
      }).join('');
    },
    det(id) {
      const p = AP.find(x=>x.id===id); if(!p)return;
      const m = document.getElementById('det-m');
      m.dataset.pid = id; m.dataset.szs = '[]';
      const pcode = code(p);
      const price = minP(p);
      const isSO = totS(p) === 0;
      const allSzs = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).map(s=>s.size)))];
      const inStk = [...new Set((p.variants||[]).flatMap(v=>(v.sizes||[]).filter(s=>+s.stock>0).map(s=>s.size)))];
      const szShow = isSO ? allSzs : inStk;
      const cols = (p.variants||[]).map(v=>v.color).filter(Boolean);
      const photos = p.photos||[];
      const gall = photos[0] ? `<img src="${photos[0].data}" id="dimg" class="mimg">` : `<div class="mph">👗</div>`;
      const thumbs = photos.length>1 ? `<div class="thumbrow">${photos.map((ph,i)=>`<img src="${ph.data}" class="thumb${i===0?' active':''}" onclick="C.setImg(this)">`).join('')}</div>` : '';
      const szH = szShow.length ? szShow.map(s=>`<span class="sz" onclick="C.selSz(this,'${e(s)}')">${e(s)}</span>`).join('') : `<span class="sz" style="opacity:0.5">${isSO ? 'No size info' : 'Contact for sizes'}</span>`;
      const clH = cols.length ? `<div class="colorlist">${cols.map(c=>`<span class="ctag"><span class="cdotl" style="background:${clr(c)}"></span>${e(c)}</span>`).join('')}</div>` : '';
      const actBtns = isSO ? `<div style="background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.3);border-radius:14px;padding:16px;text-align:center;margin-bottom:14px;"><div style="color:var(--err);font-weight:800;font-size:0.9rem;">💔 Currently Sold Out</div></div><div class="dacts"><button class="btn btn-wa" style="flex:1" onclick="C.soldOutWA('${p.id}')">📩 Enquire Now</button></div>` : `<div class="dacts"><button class="btn btn-p" onclick="C.addIQ('${p.id}')" id="btn-add-${p.id}">💝 Add to Wishlist</button><button class="btn btn-wa" onclick="C.directWA('${p.id}')">💬 WhatsApp</button></div>`;
      
      m.innerHTML = `<div class="modal lg">
        <div class="mhdr"><div><div class="mcode">✨ Code: ${pcode}${isSO ? ' <span style="background:var(--err);color:#fff;font-size:0.65rem;padding:2px 10px;border-radius:20px;">SOLD OUT</span>' : ''}</div></div><button class="mclose" onclick="C.closeM('det-m')">✕</button></div>
        <div class="mbody"><div class="dg"><div class="dgal">${gall}${thumbs}</div>
        <div class="dinfo"><div><div class="dtag">${e(p.categoryName||'EXCLUSIVE')}</div><div class="dname">${e(p.name)}</div><div class="dprice">${price ? '₹'+price.toLocaleString('en-IN') : 'Ask Price'}</div></div>
        ${p.description ? `<p class="ddesc">${e(p.description)}</p>` : ''}
        ${cols.length ? `<div><div class="sec-t">Available Colors</div>${clH}</div>` : ''}
        <div><div class="sec-t">📏 Select Size(s) <span id="sz-badge" style="display:none;background:var(--acc);color:#fff;padding:2px 12px;border-radius:20px;font-size:0.7rem;font-weight:800;"></span></div><div class="szrow" id="szrow-${p.id}">${szH}</div></div>
        ${actBtns}</div></div></div></div>`;
      m.classList.add('open');
    },
    setImg(t) { document.getElementById('dimg').src = t.src; document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active')); t.classList.add('active'); },
    selSz(el, sz) { /* Same as original */ el.classList.toggle('active'); const m = document.getElementById('det-m'); let szs = JSON.parse(m.dataset.szs || '[]'); if (szs.includes(sz)) szs = szs.filter(s=>s!==sz); else szs.push(sz); m.dataset.szs = JSON.stringify(szs); const badge = document.getElementById('sz-badge'); if (badge) { badge.style.display = szs.length ? 'inline-block' : 'none'; badge.textContent = szs.length + ' selected'; } },
    closeM(id) { const el=document.getElementById(id); if(el) el.classList.remove('open'); if(id==='det-m') history.replaceState(null,'',location.href.split('#')[0]); },
    loadIQ() { try { const s=localStorage.getItem('bq_bask'); if(s)this.iq=JSON.parse(s); }catch(e){} this.uFAB(); },
    svIQ() { try { localStorage.setItem('bq_bask',JSON.stringify(this.iq)); }catch(e){} this.uFAB(); },
    addIQ(id) { const p = AP.find(x=>x.id===id); if(!p) return; const m = document.getElementById('det-m'); const szs = JSON.parse(m.dataset.szs || '[]'); const key = p.id + (szs.length ? '|' + [...szs].sort().join(',') : ''); if (!this.iq.some(x=>x.id===key)) { this.iq.push({ id:key, pid:p.id, name:p.name, sizes:szs, code:getRawIdForWA(p), price:minP(p), photo:p.photos?.[0]?.data }); this.svIQ(); toast('💝 Added to your wishlist!'); m.dataset.szs = '[]'; this.closeM('det-m'); } else toast('✨ Already in your wishlist!'); },
    uFAB() { const f=document.getElementById('fab'), c=document.getElementById('fcnt'); if(this.iq.length) { f.classList.remove('hide'); c.textContent=this.iq.length; } else f.classList.add('hide'); },
    sendWA() { if(!this.iq.length) return; const ph = (_settings.whatsappNumber||'').replace(/\D/g,''); let msg = '💝 *Order Inquiry*\n\n'; this.iq.forEach((i,idx) => { msg += `${idx+1}. ${i.name} - ${i.code}\n`; }); window.open((ph ? 'https://wa.me/'+ph : 'https://wa.me/') + '?text=' + encodeURIComponent(msg), '_blank'); },
    directWA(id) { const p = AP.find(x=>x.id===id); if(!p) return; const ph = (_settings.whatsappNumber||'').replace(/\D/g,''); let msg = `💎 *${p.name}*\nCode: ${getRawIdForWA(p)}\n`; window.open((ph ? 'https://wa.me/'+ph : 'https://wa.me/') + '?text=' + encodeURIComponent(msg), '_blank'); },
    soldOutWA(id) { const p = AP.find(x=>x.id===id); if(!p) return; const ph = (_settings.whatsappNumber||'').replace(/\D/g,''); let msg = `💔 *Restock Inquiry*\n${p.name} - ${getRawIdForWA(p)}\n`; window.open((ph ? 'https://wa.me/'+ph : 'https://wa.me/') + '?text=' + encodeURIComponent(msg), '_blank'); },
    bind() {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (hash) { const p = AP.find(x=>x.id===hash); if (p) setTimeout(()=>this.det(hash), 300); }
      const tips = ['Discover elegance...','Find your perfect look...','Shop the latest trends...','Luxury awaits you...'];
      let ti=0, char=0, isRm=false;
      const type = () => {
        const inp = document.getElementById('sinput'); if(!inp) return;
        const full = tips[ti];
        if(!isRm) { inp.placeholder = full.substring(0, char++); if(char > full.length) { isRm=true; setTimeout(type, 2500); } else setTimeout(type, 120); }
        else { inp.placeholder = full.substring(0, char--); if(char === 0) { isRm=false; ti=(ti+1)%tips.length; setTimeout(type, 600); } else setTimeout(type, 60); }
      };
      type();
      document.getElementById('sinput').oninput = ev => { this.q = ev.target.value.trim().toLowerCase(); this.renderGrid(); };
      document.getElementById('fab').onclick = () => this.openIQ();
      document.addEventListener('keydown', ev => { if(ev.key==='Escape'){ this.closeM('det-m'); } });
    },
    openIQ() { document.getElementById('iq-m').classList.add('open'); },
    clearIQ() { this.iq=[]; this.svIQ(); this.closeM('iq-m'); },
    clearFilters() { this.filters = { sizes:[], colors:[], minPrice:'', maxPrice:'', avail:'all' }; this.sort = ''; document.getElementById('sort-sel').value = ''; this.renderGrid(); },
    toggleFilters() { this._fopen = !this._fopen; document.getElementById('fdrawer').classList.toggle('open', this._fopen); },
    setSort(v) { this.sort = v; this.renderGrid(); },
    _noDataMsg() { return `<div class="state"><h3>💫 Coming Soon!</h3><p>Our collection is being curated with love.</p></div>`; }
  };
  document.addEventListener('DOMContentLoaded', ()=>C.init());
  window.C = C;
})();
</script>
